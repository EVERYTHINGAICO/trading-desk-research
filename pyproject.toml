[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "everythingai-trading-desk-research"
version = "0.9.0a1"
description = "Auditable algorithmic trading research and Binance Futures Demo execution system."
readme = "README.md"
requires-python = ">=3.13"
authors = [
  { name = "Everything AI Co", email = "developer@everythingaico.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
]

[project.urls]
Homepage = "https://www.everythingaico.com/"
Repository = "https://github.com/EVERYTHINGAICO/trading-desk-research"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
